<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenarios</title>
    <!-- Grafana's backend normally injects this before any app code runs, and
         @grafana/runtime reads it at module-evaluation time to build `config`.
         Seeding the minimum shape here (rather than from a module) guarantees
         it lands first whatever the import graph looks like. -->
    <script>
      window.grafanaBootData = {
        assets: { dark: '', light: '' },
        settings: {},
        user: { theme: 'dark' },
        navTree: [],
      };
      // @grafana/ui loads icons and fonts from `<public path>build/img/icons/`
      // and `<public path>fonts/`. Unset, the path is a relative `public/`,
      // which breaks on any route more than one segment deep. Grafana sets
      // this on boot; `/public/` is where Vite serves `public/public/`.
      window.__grafana_public_path__ = '/public/';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
